name: image

# Build obsidian-sync and publish it to GHCR, so freeside only ever PULLS it
# (Portainer no longer builds anything at deploy time). See the freeside Debian
# Migration plan, decision D10.
#
# Tags: sha-<short commit> (what compose pins) and main (newest build).
# Deploy flow: this runs on push to main; then pin docker-compose.yml to the new
# sha- tag in a separate commit and redeploy. The image is pulled with the
# read-only ghcr-pull token (1Password homelab), set as Portainer's ghcr.io registry.
#
# GitHub-hosted on purpose: this repo is PUBLIC, so hosted minutes are free, and
# a self-hosted runner on a public repo would run code from anyone's fork. The
# package itself is private (GHCR default for a new package).

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - sync-loop.sh
      - .github/workflows/image.yml
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ndt47/obsidian-sync
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # freeside
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
